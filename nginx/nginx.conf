user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format combined_ext '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" $request_time';

    access_log  /var/log/app/access.log  combined_ext;
    error_log   /var/log/app/error.log   warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name nutrialianza.local;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # endpoint simple para health checks (UC del enunciado)
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
